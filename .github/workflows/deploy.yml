# CI/CD: setiap push ke main -> tes -> build image -> deploy ke ECS (CodeDeploy blue/green canary).
# Secrets AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN kedaluwarsa tiap sesi lab:
# perbarui dari "AWS Details" setiap kali Start Lab.
name: test-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Unit tests
        run: |
          pip install pytest moto boto3
          python -m pytest -v tests

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency: deploy-aws
    env:
      AWS_REGION: us-east-1
      STACK_PREFIX: tour
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install boto3
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Build and deploy
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          ALLOWED_IPS: ${{ vars.ALLOWED_IPS }}
          DEPLOYMENT_CONFIG: ${{ vars.DEPLOYMENT_CONFIG }}
        run: |
          chmod +x scripts/*.sh
          ./scripts/deploy.sh
