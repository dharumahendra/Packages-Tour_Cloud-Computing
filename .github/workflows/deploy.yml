# CI/CD: setiap push ke main -> tes -> build image -> deploy ke ECS (CodeDeploy blue/green canary).
# Secrets AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN kedaluwarsa tiap sesi lab:
# perbarui dari "AWS Details" setiap kali Start Lab.
name: test-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Unit tests
        run: |
          pip install pytest moto boto3
          python -m pytest -v tests

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency: deploy-aws
    env:
      AWS_REGION: us-east-1
      STACK_PREFIX: tour
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install boto3
      # Bersihkan secret dari spasi/baris baru/awalan "aws_xxx=" yang sering ikut tersalin dari AWS Details
      - name: Load AWS credentials
        env:
          KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          clean() { printf '%s' "$1" | tr -d '[:space:]' | sed -E 's/^aws_[a-z_]+=//'; }
          for pair in "AWS_ACCESS_KEY_ID:$KEY_ID" "AWS_SECRET_ACCESS_KEY:$SECRET" "AWS_SESSION_TOKEN:$TOKEN"; do
            name=${pair%%:*}; value=$(clean "${pair#*:}")
            if [ -z "$value" ]; then echo "::error::Secret $name kosong"; exit 1; fi
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - name: Check AWS identity
        run: aws sts get-caller-identity --query Arn --output text
      - name: Build and deploy
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          ALLOWED_IPS: ${{ vars.ALLOWED_IPS }}
          DEPLOYMENT_CONFIG: ${{ vars.DEPLOYMENT_CONFIG }}
        run: |
          chmod +x scripts/*.sh
          ./scripts/deploy.sh
