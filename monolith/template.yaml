AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: MONOLIT paket wisata - satu Lambda untuk semua route (kondisi awal, Fase 2)

Parameters:
  LabRoleArn:
    Type: String
    Description: ARN role untuk Lambda (hasil cek role IAM)

Resources:
  PackagesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-packages"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: packageId
          AttributeType: S
      KeySchema:
        - AttributeName: packageId
          KeyType: HASH

  MonolithApi:
    Type: AWS::Serverless::HttpApi

  MonolithFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-function"
      Runtime: python3.12
      Handler: app.lambda_handler
      Timeout: 10
      MemorySize: 128
      Role: !Ref LabRoleArn
      CodeUri: src/
      Environment:
        Variables:
          TABLE_NAME: !Ref PackagesTable
      Events:
        Health:
          Type: HttpApi
          Properties: {ApiId: !Ref MonolithApi, Method: GET, Path: /health}
        ListPackages:
          Type: HttpApi
          Properties: {ApiId: !Ref MonolithApi, Method: GET, Path: /packages}
        GetPackage:
          Type: HttpApi
          Properties: {ApiId: !Ref MonolithApi, Method: GET, Path: "/packages/{id}"}
        CreatePackage:
          Type: HttpApi
          Properties: {ApiId: !Ref MonolithApi, Method: POST, Path: /packages}
        UpdatePackage:
          Type: HttpApi
          Properties: {ApiId: !Ref MonolithApi, Method: PUT, Path: "/packages/{id}"}
        DeletePackage:
          Type: HttpApi
          Properties: {ApiId: !Ref MonolithApi, Method: DELETE, Path: "/packages/{id}"}

Outputs:
  ApiUrl:
    Value: !Sub "https://${MonolithApi}.execute-api.${AWS::Region}.amazonaws.com"
