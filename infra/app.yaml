AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Paket wisata - dua microservice (catalog + operator) di ECS Fargate di belakang ALB,
  rilis blue/green canary lewat CodeDeploy. Memakai role bawaan lab (PipelineRole, DeployRole).

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Minimal 2 subnet publik di AZ berbeda
  TaskRoleArn:
    Type: String
    Description: Role untuk ECS task (lab - PipelineRole; trust ecs-tasks, akses ECR read + S3 + Logs)
  DeployRoleArn:
    Type: String
    Description: Role untuk CodeDeploy (lab - DeployRole; AWSCodeDeployRoleForECS)
  CatalogImage:
    Type: String
  OperatorImage:
    Type: String
  PackagesBucket:
    Type: String
  AdminKey:
    Type: String
    NoEcho: true
    Default: ""
  AllowedIps:
    Type: String
    Default: ""
  DeploymentConfig:
    Type: String
    Default: CodeDeployDefault.ECSCanary10Percent5Minutes
    AllowedValues:
      - CodeDeployDefault.ECSCanary10Percent5Minutes
      - CodeDeployDefault.ECSLinear10PercentEvery1Minutes
      - CodeDeployDefault.ECSAllAtOnce
  DesiredCount:
    Type: Number
    Default: 1

Resources:
  # ---------- Jaringan ----------
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB paket wisata (80 produksi, 8080 tes blue/green)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0}
        - {IpProtocol: tcp, FromPort: 8080, ToPort: 8080, CidrIp: 0.0.0.0/0}

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Task ECS paket wisata, hanya menerima dari ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 8080, ToPort: 8080, SourceSecurityGroupId: !Ref AlbSecurityGroup}

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${AWS::StackName}-alb"
      Type: application
      Scheme: internet-facing
      Subnets: !Ref SubnetIds
      SecurityGroups: [!Ref AlbSecurityGroup]

  # Dua target group per service: blue (aktif) dan green (versi baru saat deploy)
  CatalogBlueTG:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      TargetType: ip
      Protocol: HTTP
      Port: 8080
      VpcId: !Ref VpcId
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 10
      HealthyThresholdCount: 2
      TargetGroupAttributes:
        - {Key: deregistration_delay.timeout_seconds, Value: "10"}
  CatalogGreenTG:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      TargetType: ip
      Protocol: HTTP
      Port: 8080
      VpcId: !Ref VpcId
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 10
      HealthyThresholdCount: 2
      TargetGroupAttributes:
        - {Key: deregistration_delay.timeout_seconds, Value: "10"}
  OperatorBlueTG:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      TargetType: ip
      Protocol: HTTP
      Port: 8080
      VpcId: !Ref VpcId
      HealthCheckPath: /admin/health
      HealthCheckIntervalSeconds: 10
      HealthyThresholdCount: 2
      TargetGroupAttributes:
        - {Key: deregistration_delay.timeout_seconds, Value: "10"}
  OperatorGreenTG:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      TargetType: ip
      Protocol: HTTP
      Port: 8080
      VpcId: !Ref VpcId
      HealthCheckPath: /admin/health
      HealthCheckIntervalSeconds: 10
      HealthyThresholdCount: 2
      TargetGroupAttributes:
        - {Key: deregistration_delay.timeout_seconds, Value: "10"}

  # Listener produksi (80): /admin/* -> operator, selain itu -> catalog
  ProdListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions: [{Type: forward, TargetGroupArn: !Ref CatalogBlueTG}]
  ProdAdminRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref ProdListener
      Priority: 10
      Conditions: [{Field: path-pattern, Values: ["/admin/*"]}]
      Actions: [{Type: forward, TargetGroupArn: !Ref OperatorBlueTG}]

  # Listener tes (8080) dipakai CodeDeploy untuk versi baru sebelum trafik dialihkan
  TestListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 8080
      Protocol: HTTP
      DefaultActions: [{Type: forward, TargetGroupArn: !Ref CatalogGreenTG}]
  TestAdminRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref TestListener
      Priority: 10
      Conditions: [{Field: path-pattern, Values: ["/admin/*"]}]
      Actions: [{Type: forward, TargetGroupArn: !Ref OperatorGreenTG}]

  # ---------- ECS ----------
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${AWS::StackName}-cluster"

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${AWS::StackName}"
      RetentionInDays: 7

  CatalogTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${AWS::StackName}-catalog"
      Cpu: "256"
      Memory: "512"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !Ref TaskRoleArn
      TaskRoleArn: !Ref TaskRoleArn
      ContainerDefinitions:
        - Name: catalog
          Image: !Ref CatalogImage
          Essential: true
          PortMappings: [{ContainerPort: 8080, Protocol: tcp}]
          Environment:
            - {Name: PACKAGES_BUCKET, Value: !Ref PackagesBucket}
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: catalog

  OperatorTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${AWS::StackName}-operator"
      Cpu: "256"
      Memory: "512"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !Ref TaskRoleArn
      TaskRoleArn: !Ref TaskRoleArn
      ContainerDefinitions:
        - Name: operator
          Image: !Ref OperatorImage
          Essential: true
          PortMappings: [{ContainerPort: 8080, Protocol: tcp}]
          Environment:
            - {Name: PACKAGES_BUCKET, Value: !Ref PackagesBucket}
            - {Name: ADMIN_KEY, Value: !Ref AdminKey}
            - {Name: ALLOWED_IPS, Value: !Ref AllowedIps}
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: operator

  CatalogService:
    Type: AWS::ECS::Service
    DependsOn: [ProdListener, TestListener]
    Properties:
      ServiceName: !Sub "${AWS::StackName}-catalog"
      Cluster: !Ref Cluster
      TaskDefinition: !Ref CatalogTaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      HealthCheckGracePeriodSeconds: 30
      DeploymentController: {Type: CODE_DEPLOY}
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref SubnetIds
          SecurityGroups: [!Ref TaskSecurityGroup]
      LoadBalancers:
        - {ContainerName: catalog, ContainerPort: 8080, TargetGroupArn: !Ref CatalogBlueTG}

  OperatorService:
    Type: AWS::ECS::Service
    DependsOn: [ProdAdminRule, TestAdminRule]
    Properties:
      ServiceName: !Sub "${AWS::StackName}-operator"
      Cluster: !Ref Cluster
      TaskDefinition: !Ref OperatorTaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      HealthCheckGracePeriodSeconds: 30
      DeploymentController: {Type: CODE_DEPLOY}
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref SubnetIds
          SecurityGroups: [!Ref TaskSecurityGroup]
      LoadBalancers:
        - {ContainerName: operator, ContainerPort: 8080, TargetGroupArn: !Ref OperatorBlueTG}

  # ---------- CodeDeploy (blue/green canary) ----------
  CodeDeployApplication:
    Type: AWS::CodeDeploy::Application
    Properties:
      ApplicationName: !Ref AWS::StackName
      ComputePlatform: ECS

  CatalogDeploymentGroup:
    Type: AWS::CodeDeploy::DeploymentGroup
    Properties:
      ApplicationName: !Ref CodeDeployApplication
      DeploymentGroupName: !Sub "${AWS::StackName}-catalog"
      ServiceRoleArn: !Ref DeployRoleArn
      DeploymentConfigName: !Ref DeploymentConfig
      DeploymentStyle: {DeploymentType: BLUE_GREEN, DeploymentOption: WITH_TRAFFIC_CONTROL}
      BlueGreenDeploymentConfiguration:
        DeploymentReadyOption: {ActionOnTimeout: CONTINUE_DEPLOYMENT, WaitTimeInMinutes: 0}
        TerminateBlueInstancesOnDeploymentSuccess: {Action: TERMINATE, TerminationWaitTimeInMinutes: 0}
      AutoRollbackConfiguration:
        Enabled: true
        Events: [DEPLOYMENT_FAILURE, DEPLOYMENT_STOP_ON_REQUEST]
      ECSServices:
        - {ClusterName: !Ref Cluster, ServiceName: !GetAtt CatalogService.Name}
      LoadBalancerInfo:
        TargetGroupPairInfoList:
          - TargetGroups:
              - {Name: !GetAtt CatalogBlueTG.TargetGroupName}
              - {Name: !GetAtt CatalogGreenTG.TargetGroupName}
            ProdTrafficRoute: {ListenerArns: [!Ref ProdListener]}
            TestTrafficRoute: {ListenerArns: [!Ref TestListener]}

  OperatorDeploymentGroup:
    Type: AWS::CodeDeploy::DeploymentGroup
    Properties:
      ApplicationName: !Ref CodeDeployApplication
      DeploymentGroupName: !Sub "${AWS::StackName}-operator"
      ServiceRoleArn: !Ref DeployRoleArn
      DeploymentConfigName: !Ref DeploymentConfig
      DeploymentStyle: {DeploymentType: BLUE_GREEN, DeploymentOption: WITH_TRAFFIC_CONTROL}
      BlueGreenDeploymentConfiguration:
        DeploymentReadyOption: {ActionOnTimeout: CONTINUE_DEPLOYMENT, WaitTimeInMinutes: 0}
        TerminateBlueInstancesOnDeploymentSuccess: {Action: TERMINATE, TerminationWaitTimeInMinutes: 0}
      AutoRollbackConfiguration:
        Enabled: true
        Events: [DEPLOYMENT_FAILURE, DEPLOYMENT_STOP_ON_REQUEST]
      ECSServices:
        - {ClusterName: !Ref Cluster, ServiceName: !GetAtt OperatorService.Name}
      LoadBalancerInfo:
        TargetGroupPairInfoList:
          - TargetGroups:
              - {Name: !GetAtt OperatorBlueTG.TargetGroupName}
              - {Name: !GetAtt OperatorGreenTG.TargetGroupName}
            ProdTrafficRoute: {ListenerArns: [!Ref ProdListener]}
            TestTrafficRoute: {ListenerArns: [!Ref TestListener]}

Outputs:
  ApiUrl:
    Description: URL publik (ALB). Pakai sebagai API di e2e.sh dan frontend.
    Value: !Sub "http://${LoadBalancer.DNSName}"
  ClusterName:
    Value: !Ref Cluster
  CatalogServiceName:
    Value: !GetAtt CatalogService.Name
  OperatorServiceName:
    Value: !GetAtt OperatorService.Name
  CodeDeployApplication:
    Value: !Ref CodeDeployApplication
  CatalogDeploymentGroup:
    Value: !Sub "${AWS::StackName}-catalog"
  OperatorDeploymentGroup:
    Value: !Sub "${AWS::StackName}-operator"
